# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Cargo.toml — Counsel crate manifest.
#
# One crate, two halves plus the attributes:
#   * runtime checks — always built: the Briev-authored predicate core
#     (bridge/counsel.bv) is compiled to a native static library by build.rs.
#   * static proof   — `--features static`: translates a restricted pure-integer
#     Rust subset and discharges it through `brievc --verify-bodies`.
#   * attributes     — `--features macros` (default): `#[pre]`/`#[post]`/`#[case]`
#     are inert markers that let the source compile. Enforcement comes from
#     `counsel-check` (static) or `contract()` (runtime), never the attribute.
#
# `counsel-macros` stays a separate crate only because Rust requires
# `proc-macro = true` crates to stand alone. `counsel` re-exports its
# attributes, so a user depends on this crate alone.

[package]
name = "counsel"
version = "0.1.11"
edition = "2021"
description = "Static and runtime pre/post-condition verification for Rust: the predicate core is authored in Briev and compiled to native, while contracts are discharged by Briev's own body prover. Lighter than Kani."
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/Randozart/counsel"
homepage = "https://github.com/Randozart/counsel"
documentation = "https://docs.rs/counsel"
readme = "README.md"
keywords = ["verification", "contracts", "precondition", "postcondition", "briev"]
categories = ["development-tools::testing", "compilers"]

[features]
default = ["macros"]
# Contract attributes: `#[pre]`, `#[post]`, `#[case]` (inert markers).
macros = ["dep:counsel-macros"]
# Static verification of a restricted pure-integer Rust subset.
static = ["dep:syn", "dep:serde_json"]
# In-process verification through the briev-verify library: no subprocess, no
# pinned toolchain. Experimental until it reaches parity with `static`.
static-lib = ["static", "dep:briev-verify"]

[dependencies]
counsel-macros = { version = "0.1", path = "counsel-macros", optional = true }
serde_json = { version = "1", optional = true }
briev-verify = { path = "../briev-lang/briev-verify", optional = true }
syn = { version = "2", features = ["full", "parsing", "extra-traits", "visit", "visit-mut"], optional = true }

[[bin]]
name = "counsel-check"
path = "src/bin/counsel-check.rs"
required-features = ["static"]

[[test]]
name = "valve"
path = "tests/valve.rs"
required-features = ["static"]

[workspace]
members = ["counsel-macros"]
# CI checks out the compiler here (and so may a developer); it is not a member.
exclude = [".briev-lang"]
resolver = "2"

[[example]]
name = "measure_constructs"
required-features = ["static"]
