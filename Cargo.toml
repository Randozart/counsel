# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Cargo.toml — Counsel crate manifest.
#
# The verification machinery is authored in Briev (bridge/counsel.bv) and
# compiled to a native static library by build.rs, which also links it into
# this crate. Rust is the thin facade (safe API over the C-ABI bindings in
# src/bindings.rs).

[package]
name = "counsel"
version = "0.1.0"
edition = "2021"
description = "Static and runtime pre/post-condition verification for Rust: the predicate core is authored in Briev and compiled to native, while contracts are discharged by Briev's own body prover. Lighter than Kani."
license = "Apache-2.0 WITH LLVM-exception"
keywords = ["verification", "contracts", "precondition", "postcondition", "briev"]
categories = ["development-tools::testing", "compilers"]

[dependencies]

[build-dependencies]
# 2026-11-11 (Phase 4 valve): counsel-static translates a restricted
# pure-integer Rust subset into Briev defns and discharges them through
# `brievc --verify-bodies` (landed in briev-lang c0ce60dc).
[workspace]
members = ["counsel-static", "counsel-macros"]
# CI checks out the compiler here (and so may a developer); it is not a member.
exclude = [".briev-lang"]
resolver = "2"
